<body class="is-compact">

<noscript>
  <div style="padding:16px; text-align:center; background:#8b1e1e; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    இந்த தளத்திற்கு JavaScript தேவை. உலாவி அமைப்புகளில் JavaScript-ஐ இயக்கவும். &nbsp;/&nbsp; This site needs JavaScript to work. Please enable JavaScript in your browser and reload.
  </div>
</noscript>

<div id="gate">
  <div class="card">
    <h1 class="gate-name">ஸ்ரீ வீரமாத்தி அம்மன் துணை</h1>
    <img src="../logo-gate.jpg" alt="ஸ்ரீ வீரமாத்தி அம்மன் துணை" class="gate-logo" width="385" height="520" fetchpriority="high" />
    <p class="gate-subtitle">Accounts Entry</p>
    <form id="gate-form">
      <label>Password
        <input type="password" id="gate-password" required autofocus autocomplete="current-password" />
      </label>
      <button type="submit">Unlock</button>
      <p class="status error" id="gate-status" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sticky-top-stack">
    <header>
      <h1><span class="header-logo-container"><img src="logo-emblem-only.png" alt="" role="presentation" class="header-logo-main" width="128" height="128" /></span><span class="header-title-text">ஸ்ரீ வீரமாத்தி அம்மன் துணை</span></h1>
      <button type="button" id="logout-btn" class="header-link-btn logout-btn" aria-label="Sign out"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><g fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></g></g></svg><span>Logout</span></button>
    </header>

    <div class="sticky-top-inner">
      <section class="card compact sheet-filter-card">
        <div class="pills-inline">
          <div class="pill-line">
            <div id="function-pills" class="pill-row"></div>
          </div>
        </div>
        <p class="status" id="sheet-status" role="status" aria-live="polite"></p>
      </section>

      <h2 id="sheet-title"><span class="sheet-title-inner">Ledger Sheet</span></h2>

      <div class="sheet-thead-wrap" id="sheet-thead-wrap">
        <table class="sheet wide">
          <thead>
            <tr><th>S.No</th><th>இரசீது எண்</th><th>பெயர்</th><th>ஊர்</th><th>மொபைல் எண்</th><th>தலைக்கட்டு வரி</th><th class="note-th" title="குறிப்பு (notes)"><span class="sr-only">குறிப்பு</span></th></tr>
            <tr class="filter-row">
              <td><input type="text" id="filter-sno" class="filter-input" placeholder="Filter" aria-label="Filter by S.No" /></td>
              <td><input type="text" id="filter-receipt" class="filter-input" placeholder="Filter" aria-label="Filter by இரசீது எண் (receipt number)" /></td>
              <td><input type="text" id="filter-name" class="filter-input" placeholder="Filter" aria-label="Filter by Tamil name (பெயர்)" /></td>
              <td>
                <label for="filter-place" class="sr-only">Filter by ஊர் (place)</label>
                <select id="filter-place" class="filter-input" aria-label="Filter by ஊர் (place)">
                  <option value="">அனைத்தும்</option>
                </select>
              </td>
              <td><input type="text" id="filter-mobile" class="filter-input" placeholder="Filter" aria-label="Filter by மொபைல் எண் (mobile number)" /></td>
              <td>
                <label for="filter-santha" class="sr-only">Filter by தலைக்கட்டு வரி</label>
                <select id="filter-santha" class="filter-input" aria-label="Filter by தலைக்கட்டு வரி payment status">
                  <option value="">அனைத்தும்</option>
                  <option value="paid">செலுத்தியவர்</option>
                  <option value="unpaid">செலுத்தாதவர்</option>
                </select>
              </td>
              <td></td>   <!-- the notes column is 30px wide: an icon only, no filter box -->
            </tr>
          </thead>
        </table>
      </div>

      <!-- Column header of the typed-lines tables (வரவு tabs + செலவு): same pinned look as #sheet-thead-wrap above.
           Its columns come from income.js (renderIncome) and line up with #income-body's table below. -->
      <div class="sheet-thead-wrap hidden" id="income-thead-wrap">
        <table class="sheet income-table">
          <colgroup id="income-cols-head"></colgroup>
          <thead id="income-head"></thead>
        </table>
      </div>
    </div>
  </div>

  <main>

    <section class="expense-card income-card hidden" id="income-card">
      <div class="table-wrap sheet-tbody-wrap" id="income-tbody-wrap">
        <table class="sheet income-table">
          <colgroup id="income-cols-body"></colgroup>
          <tbody id="income-body"></tbody>
          <tfoot id="income-foot"></tfoot>
        </table>
      </div>
      <p class="income-add-row"><button type="button" class="secondary" id="income-add">+ புதிய வரி</button></p>
      <p class="status" id="income-status" role="status" aria-live="polite"></p>
    </section>

    <section class="card sheet-table-card">
      <div class="table-wrap sheet-tbody-wrap" id="sheet-tbody-wrap">
      <table class="sheet wide">
        <tbody id="sheet-body"></tbody>
      </table>
      </div>
    </section>

  </main>

  <div class="totals-banner totals-banner-two" id="totals-banner">
    <div class="banner-left-group" id="banner-left-group">
      <a href="members.html" class="header-link-btn"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><circle cx="16.5" cy="8" r="3.4" fill="#f59e0b"/><path d="M11 20c0-3.2 2.4-5.6 5.5-5.6S22 16.8 22 20z" fill="#f59e0b"/><circle cx="8.5" cy="8.5" r="4" fill="#2563eb"/><path d="M1 21c0-4 3.3-7 7.5-7s7.5 3 7.5 7z" fill="#2563eb"/></g></svg><span>தலைக்கட்டு விவரம்</span></a>
      <a href="../functions-dashboard/index.html" class="header-link-btn"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><rect x="2" y="12" width="5.5" height="9" rx="1.6" fill="#2563eb"/><rect x="9.2" y="3" width="5.5" height="18" rx="1.6" fill="#16a34a"/><rect x="16.5" y="8" width="5.5" height="13" rx="1.6" fill="#f59e0b"/></g></svg><span>Admin &rarr;</span></a>
    </div>
    <div class="totals-track" id="totals-track">
      <div class="totals-col totals-col-grand totals-col-members" data-col="6"><span class="totals-value totals-grand totals-shine">Collected = <span id="totals-total">0</span> / <span id="totals-expected">0</span>&emsp;Need = <span id="totals-need">0</span></span></div>
      <div class="totals-col totals-col-grand totals-col-line" data-col="6"><span class="totals-value totals-grand totals-shine"><span id="line-strip-label">மொத்தம்</span> = <span id="line-strip-total">0</span></span></div>
    </div>
  </div>

</div>

<div id="print-sheet"></div>
