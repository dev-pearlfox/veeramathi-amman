  <div class="sticky-top-inner">
    <section class="card compact members-filter-card">
      <div id="group-pills" class="pill-row" role="group" aria-label="Member list">
        <button type="button" class="pill active" data-group="thalaikattu" aria-pressed="true">தலைக்கட்டு</button>
        <button type="button" class="pill" data-group="others" aria-pressed="false">Donors</button>
      </div>
      <button type="button" id="print-btn" class="members-toggle print-btn">Print / save as PDF</button>
    </section>

    <div class="members-thead-wrap" id="members-thead-wrap">
      <table class="sheet wide members-table">
        <thead>
          <tr><th>S.No</th><th>Roll No.</th><th>பெயர்</th><th>English Name</th><th>Home Address</th><th>Postal Address</th><th>Mobile Number</th><th>பிறந்த தேதி</th><th>Avoid</th></tr>
          <tr class="filter-row">
            <td><label for="filter-sno" class="sr-only">Filter by S.No</label><input type="text" id="filter-sno" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-roll" class="sr-only">Filter by Roll No.</label><input type="text" id="filter-roll" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-name" class="sr-only">Filter by பெயர்</label><input type="text" id="filter-name" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-name-en" class="sr-only">Filter by English Name</label><input type="text" id="filter-name-en" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-place" class="sr-only">Filter by Home Address</label><input type="text" id="filter-place" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-postal" class="sr-only">Filter by Postal Address</label><input type="text" id="filter-postal" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-mobile" class="sr-only">Filter by Mobile Number</label><input type="text" id="filter-mobile" class="filter-input" placeholder="Filter" inputmode="numeric" /></td>
            <td><label for="filter-dob" class="sr-only">Filter by பிறந்த தேதி</label><input type="text" id="filter-dob" class="filter-input" placeholder="dd-mm-yyyy" /></td>
            <td aria-hidden="true"></td>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</div>

<main>
  <section class="card members-table-card">
    <div class="table-wrap members-tbody-wrap" id="members-tbody-wrap">
      <table class="sheet wide members-table">
        <!-- The orange "Table 1 - 15 members" bar of the first table showing (members.js). A caption, NOT a row: a full-width first row
             would take over the column widths (HEART_LOGIC #7: they are read from the first row). -->
        <caption id="members-caption" class="family-caption"></caption>
        <tbody id="members-body"></tbody>
        <tfoot>
          <tr id="new-member-row">
            <td id="new-m-sno" class="new-member-num"></td>
            <td id="new-m-roll" class="new-member-num"></td>
            <td><label for="new-m-name" class="sr-only">New member's பெயர்</label><input type="text" id="new-m-name" placeholder="புதிய பெயரை உள்ளிடவும்..." /></td>
            <td><label for="new-m-name-en" class="sr-only">New member's English Name</label><input type="text" id="new-m-name-en" placeholder="English Name" disabled /></td>
            <td><label for="new-m-place" class="sr-only">New member's Home Address</label><input type="text" id="new-m-place" placeholder="Home Address" disabled /></td>
            <td><div class="cell-flex"><button type="button" id="new-m-postal-btn" class="addr-btn" data-addr="postal_address" title="Postal Address" aria-label="New member's Postal Address" disabled><!-- home icon drawn by members.js --></button><input type="text" id="new-m-postal-town" class="postal-town" tabindex="-1" readonly placeholder="Postal Address" aria-label="New member's Postal Address town" /></div></td>
            <td><label for="new-m-mobile" class="sr-only">New member's Mobile Number</label><input type="text" id="new-m-mobile" placeholder="Mobile" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td><label for="new-m-dob" class="sr-only">New member's பிறந்த தேதி</label><input type="date" id="new-m-dob" min="1900-01-01" disabled /></td>
            <td></td>
          </tr>
          <!-- Which family table the new member joins (தலைக்கட்டு only; members.js). Kept AFTER the add row: the add row stays the
               first row of the empty table, so the column widths (HEART_LOGIC #7) are still read from it. -->
          <tr id="new-member-table-row">
            <td colspan="9"><label for="new-m-table">Add to</label> <select id="new-m-table"></select></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="status" id="members-status" role="status" aria-live="polite"></p>
  </section>
</main>
