<div class="sticky-top-stack">
  <header>
    <h1><span class="header-logo-container"><svg class="header-logo-main" width="90" height="90" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><circle cx="16.5" cy="8" r="3.4" fill="#f59e0b"/><path d="M11 20c0-3.2 2.4-5.6 5.5-5.6S22 16.8 22 20z" fill="#f59e0b"/><circle cx="8.5" cy="8.5" r="4" fill="#2563eb"/><path d="M1 21c0-4 3.3-7 7.5-7s7.5 3 7.5 7z" fill="#2563eb"/></g></svg></span><span class="header-title-text">தலைக்கட்டு விவரம்</span></h1>
    <button type="button" id="logout-btn" class="header-link-btn logout-btn" aria-label="Sign out"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><g fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></g></g></svg><span>Logout</span></button>
  </header>

  <div class="sticky-top-inner">
    <section class="card compact members-filter-card">
      <button type="button" id="print-btn" class="members-toggle print-btn">Print / save as PDF</button>
    </section>

    <div class="members-thead-wrap" id="members-thead-wrap">
      <table class="sheet wide members-table">
        <thead>
          <tr><th>S.No</th><th>Roll No.</th><th>பெயர்</th><th>Name</th><th>ஊர்</th><th>Mobile Number</th><th>பிறந்த தேதி</th><th>Avoid</th></tr>
          <tr class="filter-row">
            <td><label for="filter-sno" class="sr-only">Filter by S.No</label><input type="text" id="filter-sno" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-roll" class="sr-only">Filter by Roll No.</label><input type="text" id="filter-roll" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-name" class="sr-only">Filter by பெயர்</label><input type="text" id="filter-name" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-name-en" class="sr-only">Filter by Name</label><input type="text" id="filter-name-en" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-place" class="sr-only">Filter by ஊர்</label><input type="text" id="filter-place" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-mobile" class="sr-only">Filter by Mobile Number</label><input type="text" id="filter-mobile" class="filter-input" placeholder="Filter" inputmode="numeric" /></td>
            <td><label for="filter-dob" class="sr-only">Filter by பிறந்த தேதி</label><input type="text" id="filter-dob" class="filter-input" placeholder="dd-mm-yyyy" /></td>
            <td aria-hidden="true"></td>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</div>

<main>
  <section class="card members-table-card">
    <div class="table-wrap members-tbody-wrap" id="members-tbody-wrap">
      <table class="sheet wide members-table">
        <tbody id="members-body"></tbody>
        <tfoot>
          <tr id="new-member-row">
            <td id="new-m-sno" class="new-member-num"></td>
            <td id="new-m-roll" class="new-member-num"></td>
            <td><label for="new-m-name" class="sr-only">New member's பெயர்</label><input type="text" id="new-m-name" placeholder="புதிய பெயரை உள்ளிடவும்..." /></td>
            <td><label for="new-m-name-en" class="sr-only">New member's Name</label><input type="text" id="new-m-name-en" placeholder="Name" /></td>
            <td><label for="new-m-place" class="sr-only">New member's ஊர்</label><input type="text" id="new-m-place" placeholder="ஊர்" disabled /></td>
            <td><label for="new-m-mobile" class="sr-only">New member's Mobile Number</label><input type="text" id="new-m-mobile" placeholder="Mobile" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td><label for="new-m-dob" class="sr-only">New member's பிறந்த தேதி</label><input type="date" id="new-m-dob" min="1900-01-01" disabled /></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="status" id="members-status" role="status" aria-live="polite"></p>
  </section>
</main>

<div class="totals-banner totals-banner-simple">
  <div class="banner-left-group">

    <button type="button" id="master-lock-btn" class="header-link-btn master-lock-btn" aria-label="Unlock editing" aria-pressed="false" title="Unlock editing"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><g fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></g></g></svg><span>Edit</span></button>
    <button type="button" id="master-cancel-btn" class="header-link-btn master-lock-btn" aria-label="Cancel editing" title="Cancel: undo the changes made since unlocking"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><g transform="translate(4.2 4.2) scale(0.65)"><g fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></g></g></svg><span>Cancel</span></button>
  </div>
